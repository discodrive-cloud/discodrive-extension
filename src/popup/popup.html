<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <div id="unpaired" hidden>
      <p data-i18n="popupUnpaired"></p>
      <button id="open-options" class="btn accent" data-i18n="popupOpenOptions"></button>
    </div>
    <div id="paired" class="actions" hidden>
      <button id="pocket" class="btn accent" data-i18n="popupPocket"></button>
      <div id="status" class="status" hidden></div>
      <ul id="tasks"></ul>
    </div>
    <footer>
      <a href="#" id="settings-link" data-i18n="popupSettings"></a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
